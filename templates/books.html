
<html>
    <head>
        <title>Book Store</title>
        <link rel="stylesheet" href="/static/styles.css">
    </head>
    <body>
        <h1>My Books</h1>
        <ul>
        {% for book in books %}
            <li>{{ book.title }} by {{ book.author }}</li>
        {% endfor %}
        </ul>
        <div class="newbook">
            <form action="/bookform">
                <button class="button" type="submit">
                    Add book
                </button>
            </form>
        </div>  
    </body>
</html>
